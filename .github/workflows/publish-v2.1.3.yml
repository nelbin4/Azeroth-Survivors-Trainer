name: Build and publish v2.1.3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2.1.3.yml']

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v2.1.3'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python game.py self-test
      - name: Build launcher and package
        run: python build_exe.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          gh release create v2.1.3
          release/AzerothSurvivorsTrainer-2.1.3.zip
          --repo ${{ github.repository }}
          --target $env:RELEASE_COMMIT
          --title "2.1.3 (experimental)"
          --notes "Prioritized stat freezing, verified additional stats for supported builds, executable scanning and session recovery fixes. Unknown game builds may require on-screen verification."
          --latest
